# Check if there are typos in the source code
# https://github.com/crate-ci/typos
# https://github.com/crate-ci/typos/blob/HEAD/docs/reference.md

name: Spell Check with Typos
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  typos:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Actions Repository
      uses: actions/checkout@v4

    - name: Check spelling
      # Pinned to a release tag: the upstream repo dropped its `master` branch,
      # so the floating ref no longer resolves and the workflow fails before it
      # runs a single check.
      uses: crate-ci/typos@v1.50.2
      with:
        files: ./.github ./docs ./includes ./src ./test ./*.php ./*.md
        config: ./.typos.toml