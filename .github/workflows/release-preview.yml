name: Release preview

# On a release PR into main (`version-X.Y.Z`, for a stable release merge or a
# patch), rehearse what the tag's rollup job will do and comment the result:
# the rolled CHANGELOG.md section, and the @since tags carry-since.php will
# carry back to develop or leave for a human. Nothing is written to any
# branch. The commands match release.yml's rollup job, so a changelog the
# tag would refuse fails here first.
#
# The rehearsal runs the PR's code with a read-only token. Only the comment
# job can write, and it never checks out the PR.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview the release rollup
    if: startsWith(github.head_ref, 'version-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The PR's merge ref is main with this branch merged, which is the tree
      # the tag will point at.
      - name: Checkout the merge result
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' gatherpress.php | head -n 1 | tr -d '[:space:]')"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::'${version}' is not a stable version, so there is no release to preview."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.version.outputs.version != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Composer install
        if: steps.version.outputs.version != ''
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: composer install --optimize-autoloader --prefer-dist

      - name: Roll up and carry
        if: steps.version.outputs.version != ''
        id: preview
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p preview
          problems=""

          # Each command's failure goes in the comment, and the job fails at the end.
          run_logged() {
            local title="$1"
            shift

            if ! "$@" > /tmp/step.log 2>&1; then
              problems+="- ${title} failed:"$'\n\n```\n'"$(tail -n 20 /tmp/step.log)"$'\n```\n'
              return 1
            fi
          }

          # Same commands, in the same order, as release.yml's rollup job.
          run_logged '`add-changelog-pr-nums.php`' php .github/scripts/add-changelog-pr-nums.php || true
          run_logged 'The rollup (`changelogger write`)' vendor/bin/changelogger write \
            --use-version="${VERSION}" \
            --release-date="$(date +%Y-%m-%d)" \
            --deduplicate=-1 \
            --yes || true
          run_logged '`link-changelog-prs.php`' php .github/scripts/link-changelog-prs.php || true

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            problems+="- \`CHANGELOG.md\` has no \`## [${VERSION}]\` section."$'\n'
          fi

          if ! grep -q "^\[${VERSION}\]: " CHANGELOG.md; then
            problems+="- \`CHANGELOG.md\` has no \`[${VERSION}]:\` link line. See \"Heading seems to have a linked version, but link was not found\" in \`docs/contributor/release-process.md\`."$'\n'
          fi

          section="$(awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            /^## \[/ && capture { exit }
            capture { print }
          ' CHANGELOG.md)"

          # carry-since.php reads develop's copy of each file through origin/develop.
          carry_ok=false

          if run_logged 'Fetching `develop`' git fetch --quiet origin develop \
            && run_logged '`carry-since.php`' sh -c 'php .github/scripts/release/carry-since.php --version="$1" > /tmp/carry-since.json' sh "${VERSION}"; then
            carry_ok=true
            carried=$(jq '[.additions[].resolved] | add // 0' /tmp/carry-since.json)
            files=$(jq '.additions | length' /tmp/carry-since.json)
            unmatched=$(jq -r '.unmatched | length' /tmp/carry-since.json)
          fi

          # Writes the preview, listing at most $1 unmatched files (0 for all).
          write_preview() {
            local limit="$1"
            echo '<!-- gatherpress-release-preview -->'
            echo "## Release preview for ${VERSION}"
            echo
            echo "What the \`${VERSION}\` tag's rollup will do, rehearsed on this PR merged into \`main\`. Nothing was written to any branch."
            echo

            if [[ -n "${problems}" ]]; then
              echo '### :x: The tag would fail'
              echo
              printf '%s\n' "${problems}"
            fi

            echo '### Changelog section'
            echo

            if [[ -n "${section//[[:space:]]/}" ]]; then
              printf '%s\n' "${section}"
            else
              echo '_The rollup wrote no section._'
            fi

            echo
            echo '### `@since` carry to develop'
            echo

            if [[ "${carry_ok}" != "true" ]]; then
              echo '_The carry could not run; see above._'
            elif [[ "${carried}" -gt 0 ]]; then
              echo "${carried} \`@since ${VERSION}\` tag(s) in ${files} file(s) will be carried back to \`develop\` by the rollup PR."
            else
              echo "No \`@since\` tags to carry. A minor release resolves its own on \`develop\`."
            fi

            if [[ "${carry_ok}" == "true" && "${unmatched}" -gt 0 ]]; then
              echo
              echo "**${unmatched} file(s) need a look.** Their docblocks on \`develop\` are not identical to the released ones, so the rollup will leave them and will not auto-merge. Resolve them by hand after the tag:"
              echo
              if [[ "${limit}" -gt 0 && "${unmatched}" -gt "${limit}" ]]; then
                jq -r --argjson n "${limit}" '.unmatched[:$n][] | "- `" + . + "`"' /tmp/carry-since.json
                echo "- _…and $(( unmatched - limit )) more, listed in the [run summary](${RUN_URL})._"
              else
                jq -r '.unmatched[] | "- `" + . + "`"' /tmp/carry-since.json
              fi
            fi
          }

          # The run summary keeps everything; the comment stays under GitHub's
          # 65,536-character limit.
          write_preview 0 >> "$GITHUB_STEP_SUMMARY"
          write_preview 100 > /tmp/release-preview-comment.md

          if [[ "$(wc -c < /tmp/release-preview-comment.md)" -gt 60000 ]]; then
            head -c 60000 /tmp/release-preview-comment.md | sed '$d' > preview/comment.md

            # Close a code block the cut left open.
            if (( $(grep -c '^```' preview/comment.md) % 2 )); then
              echo '```' >> preview/comment.md
            fi

            printf '\n_Truncated. The full preview is in the [run summary](%s)._\n' "${RUN_URL}" >> preview/comment.md
          else
            cp /tmp/release-preview-comment.md preview/comment.md
          fi

          if [[ -n "${problems}" ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the comment to the comment job
        if: always() && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: preview/comment.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail when the tag would fail
        if: steps.preview.outputs.failed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error::The ${VERSION} rollup would fail at the tag. See the release preview comment."
          exit 1

  # Posts the preview. It never checks out the PR, so the PR's code never runs
  # with this job's write token.
  comment:
    name: Comment the release preview
    needs: preview
    if: always() && needs.preview.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Get the comment
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-preview
          path: preview

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.preview.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -s preview/comment.md ]]; then
            mkdir -p preview
            printf '%s\n' \
              '<!-- gatherpress-release-preview -->' \
              "## Release preview for ${VERSION}" \
              '' \
              ":x: The preview stopped before it could write a result. See the [run](${RUN_URL})." \
              > preview/comment.md
          fi

          # One comment per PR, updated in place on each push.
          comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("<!-- gatherpress-release-preview -->")) | .id' | head -n 1)

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -F body=@preview/comment.md > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -F body=@preview/comment.md > /dev/null
          fi
